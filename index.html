<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#20252b;font:16px/1.6 Arial,sans-serif}

  <main>
    <h1>Benvenuto nella mia pagina</h1>

</html>
